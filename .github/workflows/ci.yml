name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, release]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: com.lovato.autoprofileswitcher.sdPlugin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: com.lovato.autoprofileswitcher.sdPlugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

      - name: Build bundle
        run: npx @vercel/ncc build app.js --out build/
