version: '3'

vars:
  PLUGIN_DIR: com.lovato.autoprofileswitcher.sdPlugin

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  deploy:
    desc: Install npm deps, deploy plugin, and restart StreamDeck
    deps: [deps]
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -SkipDeps

  deploy:quick:
    desc: Deploy plugin and restart StreamDeck (skips npm install)
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -SkipDeps

  deploy:no-restart:
    desc: Deploy plugin without restarting StreamDeck
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -SkipDeps -NoRestart

  uninstall:
    desc: Untag all plugin-owned profiles and remove plugin from StreamDeck
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -Uninstall

  deps:
    desc: Install npm dependencies inside the plugin folder
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - npm install

  restart:
    desc: Restart the StreamDeck application
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -Command "Stop-Process -Name 'StreamDeck' -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; Start-Process '$env:ProgramFiles\Elgato\StreamDeck\StreamDeck.exe'"

  pack:
    desc: Package plugin into .streamDeckPlugin installer
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - mkdir -p ../dist
      - npx streamdeck pack . -o ../dist/ --force --no-update-check

  pack:release:
    desc: Package plugin with version from latest git tag
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - mkdir -p ../dist
      - npx streamdeck pack . -o ../dist/ --version $(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//') --force --no-update-check
