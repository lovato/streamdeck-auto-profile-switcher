version: '3'

vars:
  PLUGIN_DIR: com.lovato.autoprofileswitcher.sdPlugin
  DOCS_DIR: docs

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  hooks:install:
    desc: Use tracked hooks in .githooks/ for this clone (run once after clone)
    cmds:
      - git config core.hooksPath .githooks

  hooks:uninstall:
    desc: Stop using tracked hooks and restore git defaults for this clone
    cmds:
      - git config --unset core.hooksPath

  git:pre-commit:
    desc: Git pre-commit hook — customize steps here
    silent: true
    cmds:
      - 'true'

  git:pre-push:
    desc: Git pre-push hook — customize steps here
    silent: true
    cmds:
      - 'true'

  deploy:
    desc: Install npm deps, build, deploy plugin, and restart StreamDeck
    deps: [deps]
    cmds:
      - task: build
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -SkipDeps

  deploy:quick:
    desc: Build and deploy plugin, restart StreamDeck (skips npm install)
    cmds:
      - task: build
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -SkipDeps

  deploy:no-restart:
    desc: Build and deploy plugin without restarting StreamDeck
    cmds:
      - task: build
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -SkipDeps -NoRestart

  uninstall:
    desc: Untag all plugin-owned profiles and remove plugin from StreamDeck
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -Uninstall

  deps:
    desc: Install npm dependencies inside the plugin folder
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - npm install

  lint:
    desc: Run ESLint on plugin source
    deps: [deps]
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - npm run lint

  test:
    desc: Run Node.js test runner
    deps: [deps]
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - npm run test

  check:
    desc: Run lint and tests
    deps: [lint, test]

  build:
    desc: Bundle plugin dependencies into build/index.js using ncc
    deps: [check]
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - npx @vercel/ncc build app.js --out build/

  restart:
    desc: Restart the StreamDeck application
    cmds:
      - powershell.exe -NonInteractive -ExecutionPolicy Bypass -Command "Stop-Process -Name 'StreamDeck' -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; Start-Process '$env:ProgramFiles\Elgato\StreamDeck\StreamDeck.exe'"

  pack:
    desc: Build and package plugin into .streamDeckPlugin installer
    deps: [build]
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - mkdir -p ../dist
      - npx streamdeck pack . -o ../dist/ --force --no-update-check

  pack:release:
    desc: Build and package plugin with version from latest git tag
    deps: [build]
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - mkdir -p ../dist
      - npx streamdeck pack . -o ../dist/ --version $(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//') --force --no-update-check

  docs:deps:
    desc: Install npm dependencies for the docs site
    dir: '{{.DOCS_DIR}}'
    cmds:
      - npm install

  docs:dev:
    desc: Run Starlight docs site locally with live reload
    deps: [docs:deps]
    dir: '{{.DOCS_DIR}}'
    cmds:
      - npm run dev

  docs:build:
    desc: Build static docs site for GitHub Pages
    deps: [docs:deps]
    dir: '{{.DOCS_DIR}}'
    cmds:
      - npm run build

  docs:preview:
    desc: Preview the production docs build locally
    deps: [docs:build]
    dir: '{{.DOCS_DIR}}'
    cmds:
      - npm run preview
